<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnciCare PPO Timeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0f1c;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Countdown timer */
        .countdown {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            color: #4a9eff;
            font-weight: bold;
            z-index: 100;
            opacity: 0.3;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            color: #4a9eff;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: fadeIn 1s ease-out;
        }

        .timeline-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            position: relative;
            padding: 20px 0;
        }

        /* Timeline line */
        .timeline-line {
            position: absolute;
            top: 45px;
            left: 5%;
            right: 5%;
            height: 3px;
            background: rgba(74, 158, 255, 0.2);
            z-index: 0;
        }

        .timeline-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #4a9eff;
            width: 0;
            animation: grow 3s ease-out forwards;
        }

        @keyframes grow {
            to {
                width: 100%;
            }
        }

        /* Each milestone */
        .milestone {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 10;
            opacity: 0;
            animation: slideIn 0.6s ease-out forwards;
        }

        .milestone:nth-child(1) {
            animation-delay: 0.3s;
        }

        .milestone:nth-child(2) {
            animation-delay: 0.6s;
        }

        .milestone:nth-child(3) {
            animation-delay: 0.9s;
        }

        .milestone:nth-child(4) {
            animation-delay: 1.2s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dot {
            width: 30px;
            height: 30px;
            background: #0a0f1c;
            border: 3px solid #4a9eff;
            border-radius: 50%;
            margin: 0 auto 20px;
            position: relative;
        }

        .card {
            background: rgba(20, 30, 48, 0.9);
            border: 1px solid rgba(74, 158, 255, 0.3);
            border-radius: 8px;
            padding: 15px 10px;
            min-height: 150px;
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #4a9eff;
            box-shadow: 0 10px 25px rgba(74, 158, 255, 0.3);
        }

        .year {
            font-size: 1.8rem;
            font-weight: bold;
            color: #4a9eff;
            margin-bottom: 10px;
        }

        .title {
            font-size: 0.9rem;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .detail {
            font-size: 0.85rem;
            color: #a0aec0;
            line-height: 1.3;
        }

        .badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .inc500 {
            background: #f59e0b;
            color: #000;
        }

        .nasdaq {
            background: rgba(74, 158, 255, 0.2);
            color: #4a9eff;
            border: 1px solid #4a9eff;
        }

        /* Force responsive stacking on very small screens */
        @media (max-width: 768px) {
            .timeline-wrapper {
                flex-wrap: wrap;
            }

            .milestone {
                flex: 1 1 45%;
                margin-bottom: 20px;
            }

            .timeline-line {
                display: none;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .milestone {
                flex: 1 1 100%;
            }
        }
    </style>
</head>

<body>
    <div class="countdown" id="countdown"></div>
    <div class="container">
        <h1>AnciCare PPO</h1>

        <div class="timeline-wrapper">
            <div class="timeline-line">
                <div class="timeline-progress"></div>
            </div>

            <div class="milestone">
                <div class="dot"></div>
                <div class="card">
                    <div class="year">1994</div>
                    <div class="title">Founded</div>
                    <div class="detail">Company<br>Established</div>
                </div>
            </div>

            <div class="milestone">
                <div class="dot"></div>
                <div class="card">
                    <div class="year">1999</div>
                    <div class="title">Fastest Growing</div>
                    <div class="detail">Small Business in the U.S.</div>
                    <span class="badge inc500">INC 500</span>
                </div>
            </div>

            <div class="milestone">
                <div class="dot"></div>
                <div class="card">
                    <div class="year">2000</div>
                    <div class="title">Major Growth</div>
                    <div class="detail">1,200 Free-Standing Imaging<br>Centers</div>
                </div>
            </div>

            <div class="milestone">
                <div class="dot"></div>
                <div class="card">
                    <div class="year">2002</div>
                    <div class="title">Acquired</div>
                    <div class="detail">by CorVel Corporation</div>
                    <span class="badge nasdaq">NASDAQ: CRVL</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auto-refresh configuration
        const ANIMATION_DURATION = 5000; // 5 seconds
        const BUFFER_TIME = 1000; // 1 second buffer
        const TOTAL_CYCLE = ANIMATION_DURATION + BUFFER_TIME;

        // Countdown timer
        let timeLeft = TOTAL_CYCLE / 1000;
        const countdownEl = document.getElementById('countdown');

        function updateCountdown() {
            timeLeft -= 0.1;
            countdownEl.textContent = timeLeft.toFixed(1) + 's';

            if (timeLeft <= 0) {
                location.reload();
            }
        }

        // Update countdown every 100ms
        setInterval(updateCountdown, 100);

        // Auto-refresh after animation completes
        setTimeout(() => {
            location.reload();
        }, TOTAL_CYCLE);

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'r':
                case 'R':
                    // Manual refresh
                    location.reload();
                    break;
                case 's':
                case 'S':
                    // Stop auto-refresh
                    e.preventDefault();
                    window.stop();
                    countdownEl.textContent = 'STOPPED';
                    countdownEl.style.color = '#ff4444';
                    break;
                case 'g':
                case 'G':
                    // Toggle green screen
                    document.body.style.background =
                        document.body.style.background === 'rgb(0, 255, 0)'
                            ? '#0a0f1c'
                            : '#00ff00';
                    break;
                case 'h':
                case 'H':
                    // Hide countdown
                    countdownEl.style.display =
                        countdownEl.style.display === 'none'
                            ? 'block'
                            : 'none';
                    break;
            }
        });

        // Add recording indicator
        console.log('Timeline ready for recording!');
        console.log('Controls:');
        console.log('R - Restart animation');
        console.log('S - Stop auto-refresh');
        console.log('G - Toggle green screen');
        console.log('H - Hide/show countdown');
    </script>
</body>

</html>
