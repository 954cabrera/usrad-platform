<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnciCare PPO Timeline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0f1c;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Countdown timer */
        .countdown {
            position: absolute;
            top: 40px;
            right: 40px;
            font-size: 3rem;
            color: #4a9eff;
            font-weight: bold;
            z-index: 100;
            opacity: 0.3;
        }

        .container {
            width: 95vw;
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 6rem;
            margin-bottom: 4rem;
            color: #4a9eff;
            text-transform: uppercase;
            letter-spacing: 6px;
            animation: fadeIn 1s ease-out;
            font-weight: 900;
        }

        .timeline-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 40px;
            position: relative;
            padding: 40px 0;
            height: 60vh;
        }

        /* Timeline line */
        .timeline-line {
            position: absolute;
            top: 80px;
            left: 2%;
            right: 2%;
            height: 6px;
            background: rgba(74, 158, 255, 0.2);
            z-index: 0;
        }

        .timeline-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #4a9eff;
            width: 0;
            animation: grow 3s ease-out forwards;
            box-shadow: 0 0 20px rgba(74, 158, 255, 0.8);
        }

        @keyframes grow {
            to {
                width: 100%;
            }
        }

        /* Each milestone */
        .milestone {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 10;
            opacity: 0;
            animation: slideIn 0.6s ease-out forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .milestone:nth-child(1) {
            animation-delay: 0.3s;
        }

        .milestone:nth-child(2) {
            animation-delay: 0.6s;
        }

        .milestone:nth-child(3) {
            animation-delay: 0.9s;
        }

        .milestone:nth-child(4) {
            animation-delay: 1.2s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.8);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .dot {
            width: 60px;
            height: 60px;
            background: #0a0f1c;
            border: 6px solid #4a9eff;
            border-radius: 50%;
            margin: 0 auto 40px;
            position: relative;
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.6);
        }

        .card {
            background: rgba(20, 30, 48, 0.95);
            border: 2px solid rgba(74, 158, 255, 0.4);
            border-radius: 16px;
            padding: 40px 30px;
            min-height: 320px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: #4a9eff;
            box-shadow: 0 30px 60px rgba(74, 158, 255, 0.4);
        }

        .year {
            font-size: 4rem;
            font-weight: 900;
            color: #4a9eff;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(74, 158, 255, 0.5);
        }

        .title {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 16px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .detail {
            font-size: 1.6rem;
            color: #a0aec0;
            line-height: 1.5;
            font-weight: 400;
        }

        .badge {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .inc500 {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            color: #000;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .nasdaq {
            background: rgba(74, 158, 255, 0.2);
            color: #4a9eff;
            border: 2px solid #4a9eff;
            box-shadow: 0 10px 30px rgba(74, 158, 255, 0.3);
        }

        /* Remove responsive - this is for fullscreen video only */
        @media (max-width: 768px) {
            /* Keep full layout even on small preview */
        }
    </style>
</head>

<body>
    <div class="countdown" id="countdown"></div>
    <div class="container">
        <h1>AnciCare PPO</h1>

        <div class="timeline-wrapper">
            <div class="timeline-line">
                <div class="timeline-progress"></div>
            </div>

            <div class="milestone">
                <div class="dot"></div>
                <div class="card">
                    <div class="year">1994</div>
                    <div class="title">Founded</div>
                    <div class="detail">Company<br>Established</div>
                </div>
            </div>

            <div class="milestone">
                <div class="dot"></div>
                <div class="card">
                    <div class="year">1999</div>
                    <div class="title">Fastest Growing</div>
                    <div class="detail">Small Business</div>
                    <span class="badge inc500">INC 500</span>
                </div>
            </div>

            <div class="milestone">
                <div class="dot"></div>
                <div class="card">
                    <div class="year">2000</div>
                    <div class="title">Major Growth</div>
                    <div class="detail">1,200 Imaging<br>Centers</div>
                </div>
            </div>

            <div class="milestone">
                <div class="dot"></div>
                <div class="card">
                    <div class="year">2002</div>
                    <div class="title">Acquired</div>
                    <div class="detail">by CorVel</div>
                    <span class="badge nasdaq">NASDAQ: CRVL</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auto-refresh configuration
        const ANIMATION_DURATION = 5000; // 5 seconds
        const BUFFER_TIME = 1000; // 1 second buffer
        const TOTAL_CYCLE = ANIMATION_DURATION + BUFFER_TIME;

        // Countdown timer
        let timeLeft = TOTAL_CYCLE / 1000;
        const countdownEl = document.getElementById('countdown');

        function updateCountdown() {
            timeLeft -= 0.1;
            countdownEl.textContent = timeLeft.toFixed(1) + 's';

            if (timeLeft <= 0) {
                location.reload();
            }
        }

        // Update countdown every 100ms
        setInterval(updateCountdown, 100);

        // Auto-refresh after animation completes
        setTimeout(() => {
            location.reload();
        }, TOTAL_CYCLE);

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'r':
                case 'R':
                    // Manual refresh
                    location.reload();
                    break;
                case 's':
                case 'S':
                    // Stop auto-refresh
                    e.preventDefault();
                    window.stop();
                    countdownEl.textContent = 'STOPPED';
                    countdownEl.style.color = '#ff4444';
                    break;
                case 'g':
                case 'G':
                    // Toggle green screen
                    document.body.style.background =
                        document.body.style.background === 'rgb(0, 255, 0)'
                            ? '#0a0f1c'
                            : '#00ff00';
                    break;
                case 'h':
                case 'H':
                    // Hide countdown
                    countdownEl.style.display =
                        countdownEl.style.display === 'none'
                            ? 'block'
                            : 'none';
                    break;
            }
        });

        // Add recording indicator
        console.log('Timeline ready for recording!');
        console.log('Controls:');
        console.log('R - Restart animation');
        console.log('S - Stop auto-refresh');
        console.log('G - Toggle green screen');
        console.log('H - Hide/show countdown');
    </script>
</body>

</html>
